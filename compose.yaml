# podman compose up -d --build   (or: docker compose up -d --build)
services:
  spoolmaker:
    build: .
    image: spoolmaker:latest
    ports:
      - "127.0.0.1:5009:5009"   # reach it through a reverse proxy on the same host
    restart: unless-stopped
    environment:
      WEB_CONCURRENCY: "2"      # gunicorn workers (each has its own model cache)
      # BASE_PATH: /spool       # only if the proxy forwards the full /spool/... path
