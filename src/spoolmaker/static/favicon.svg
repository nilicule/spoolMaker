<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The header's brand mark: an ink-ringed spool of concentric filament rings around a hub. -->
  <style>
    .ink { fill: #2a221b; }
    .wrap { fill: #f2f2f2; }
    .gap { fill: #8f8f8f; }
    .hub { fill: #fbf7f0; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f1e8dc; }
      .hub { fill: #1f1a15; }
    }
  </style>
  <circle class="ink" cx="16" cy="16" r="16"/>
  <circle class="wrap" cx="16" cy="16" r="13.5"/>
  <circle class="gap" cx="16" cy="16" r="11"/>
  <circle class="wrap" cx="16" cy="16" r="9"/>
  <circle class="ink" cx="16" cy="16" r="6.5"/>
  <circle class="hub" cx="16" cy="16" r="4.5"/>
</svg>
